name: Windows offline checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install optional map renderer
        run: python -m pip install Pillow
      - name: Offline regressions and self-tests
        shell: pwsh
        run: |
          # Discovered, not listed. A hand-kept list let test_arming.py ship in
          # v0.6 behind green checks that never ran it. Finding nothing is a
          # failure, not a pass: discovery that quietly stopped working would
          # leave every run green for ever.
          $found = @(Get-ChildItem -Name -File test_*.py | Sort-Object)
          if ($found.Count -eq 0) { Write-Error 'no test_*.py found'; exit 1 }
          $tests = $found + @('sampler.py', 'flightprefs.py', 'passenger.py', 'trackexport.py', 'settings.py')
          Write-Host ('Running: ' + ($tests -join ', '))
          foreach ($test in $tests) {
            python -B $test
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
